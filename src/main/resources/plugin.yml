name: RPPlugin
version: '1.0.0'
main: core.RPPlugin.RPPlugin
api-version: '1.16'
authors: [Mr_Catcraft]
description: A roleplay plugin with commands /me, /do, /roll, /try, /whisper, /yell, /emote and /rp help.
commands:
  me:
    description: Describe an action in the third person.
    usage: /me <action>
  do:
    description: Describe an action or event happening nearby.
    usage: /do <action>
  roll:
    description: Roll a random number or dice.
    usage: /roll <number> or /roll <min>-<max> or /roll <amount>d<sides>[+/-<modifier>]
  try:
    description: Attempt an action with a configurable chance of success.
    usage: /try <action>
  whisper:
    description: Send a message with a short distance.
    usage: /whisper <message>
  yell:
    description: Send a message with a long distance.
    usage: /yell <message>
  emote:
    description: Perform an emote.
    usage: /emote <emote> [target]
  rp:
    description: Show help for RP commands.
    usage: /rp help